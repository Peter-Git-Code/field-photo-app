<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" font-size="12"><title>Moon phases</title><rect class="hue" x="0" y="0" width="360" height="258" rx="10" fill="#0b0d14"/><g class="hue"><circle cx="45" cy="50" r="27" fill="#2b2d35"/></g><text class="hue" x="45" y="93" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">New</text><g class="hue"><circle cx="135" cy="50" r="27" fill="#2b2d35"/><path fill="#ece8dc" d="M135 23 A27 27 0 0 1 135 77 A13.50 27 0 0 0 135 23 Z"/></g><text class="hue" x="135" y="93" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">Waxing</text><text class="hue" x="135" y="106" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">crescent</text><g class="hue"><circle cx="225" cy="50" r="27" fill="#2b2d35"/><path fill="#ece8dc" d="M225 23 A27 27 0 0 1 225 77 A0.00 27 0 0 1 225 23 Z"/></g><text class="hue" x="225" y="93" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">First</text><text class="hue" x="225" y="106" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">quarter</text><g class="hue"><circle cx="315" cy="50" r="27" fill="#2b2d35"/><path fill="#ece8dc" d="M315 23 A27 27 0 0 1 315 77 A13.50 27 0 0 1 315 23 Z"/></g><text class="hue" x="315" y="93" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">Waxing</text><text class="hue" x="315" y="106" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">gibbous</text><g class="hue"><circle cx="45" cy="158" r="27" fill="#2b2d35"/><circle cx="45" cy="158" r="27" fill="#ece8dc"/></g><text class="hue" x="45" y="201" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">Full</text><g class="hue"><circle cx="135" cy="158" r="27" fill="#2b2d35"/><path fill="#ece8dc" d="M135 131 A27 27 0 0 0 135 185 A13.50 27 0 0 0 135 131 Z"/></g><text class="hue" x="135" y="201" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">Waning</text><text class="hue" x="135" y="214" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">gibbous</text><g class="hue"><circle cx="225" cy="158" r="27" fill="#2b2d35"/><path fill="#ece8dc" d="M225 131 A27 27 0 0 0 225 185 A0.00 27 0 0 0 225 131 Z"/></g><text class="hue" x="225" y="201" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">Last</text><text class="hue" x="225" y="214" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">quarter</text><g class="hue"><circle cx="315" cy="158" r="27" fill="#2b2d35"/><path fill="#ece8dc" d="M315 131 A27 27 0 0 0 315 185 A13.50 27 0 0 1 315 131 Z"/></g><text class="hue" x="315" y="201" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">Waning</text><text class="hue" x="315" y="214" fill="#e9e6dd" font-size="11.5" font-weight="700" text-anchor="middle">crescent</text><text class="hue" x="180" y="232" fill="#f2a541" font-size="11" text-anchor="middle">Waxing: evening sky · Waning: morning sky</text><text class="hue" x="180" y="247" fill="#f2a541" font-size="11" text-anchor="middle">Seen from the southern hemisphere, flip left to right</text></svg>
