<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" font-size="12"><title>Exposure stops lined up</title><text x="66" y="16" class="a" font-size="12" text-anchor="start" font-weight="800">Brighter</text><text x="353" y="16" class="m" font-size="12" text-anchor="end" font-weight="800">Darker</text><path d="M66 24 H353" class="sm" stroke-width="2"/><path d="M66 24 l7 -4 v8 z" class="a"/><path d="M353 24 l-7 -4 v8 z" class="m"/><rect x="66" y="38" width="41" height="182" class="bg" opacity=".55"/><rect x="148" y="38" width="41" height="182" class="bg" opacity=".55"/><rect x="230" y="38" width="41" height="182" class="bg" opacity=".55"/><rect x="312" y="38" width="41" height="182" class="bg" opacity=".55"/><text x="0" y="62" class="t" font-size="13" text-anchor="start" font-weight="800">Shutter</text><text x="86.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/15</text><text x="127.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/30</text><text x="168.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/60</text><text x="209.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/125</text><text x="250.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/250</text><text x="291.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/500</text><text x="332.5" y="62" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1/1000</text><text x="68" y="82" class="m" font-size="11" text-anchor="start">← blur</text><text x="353" y="82" class="m" font-size="11" text-anchor="end">frozen →</text><text x="0" y="124" class="t" font-size="13" text-anchor="start" font-weight="800">Aperture</text><text x="86.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/2</text><text x="127.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/2.8</text><text x="168.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/4</text><text x="209.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/5.6</text><text x="250.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/8</text><text x="291.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/11</text><text x="332.5" y="124" class="t" font-size="11.5" text-anchor="middle" font-weight="700">f/16</text><text x="68" y="144" class="m" font-size="11" text-anchor="start">← soft background</text><text x="353" y="144" class="m" font-size="11" text-anchor="end">all sharp →</text><text x="0" y="186" class="t" font-size="13" text-anchor="start" font-weight="800">ISO</text><text x="86.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">6400</text><text x="127.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">3200</text><text x="168.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">1600</text><text x="209.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">800</text><text x="250.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">400</text><text x="291.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">200</text><text x="332.5" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">100</text><text x="68" y="206" class="m" font-size="11" text-anchor="start">← grainy</text><text x="353" y="206" class="m" font-size="11" text-anchor="end">clean →</text><rect x="189" y="38" width="41" height="182" class="sa" stroke-width="2.5" rx="6"/><text x="180" y="244" class="t" font-size="11.5" text-anchor="middle">Each column is one stop. Move one setting a column</text><text x="180" y="260" class="t" font-size="11.5" text-anchor="middle">and move another the same way back: same brightness.</text></svg>
